# Copy to <your-project>/configs/launcher/mycluster.yaml and use:
#   toolbox launch --config-dir configs experiment=grpo_qwen_gsm8k launcher=mycluster
name: slurm
job_name: ${name}
partition: gpu
account: my_account
qos: normal
constraint: "a100|h100"
nodes: 1
gpus_per_node: 4
cpus_per_task: 32
mem: 256G
time: "24:00:00"
requeue: true
setup:
  - "module load cuda/12.4"
  - "cd ${oc.env:PWD}"
  - "source .venv/bin/activate"
env:
  HF_HOME: /scratch/${oc.env:USER}/hf
  WANDB_MODE: offline

# @package _global_
# Minimal next-token pretraining on a tiny corpus — included for completeness/teaching.
# For real pretraining use torchtitan, Megatron-LM or nanotron; this toolbox focuses on
# post-training.
defaults:
  - override /model: tiny_gpt
  - override /data: tiny_corpus
  - override /objective: lm_ce
  - override /trainer: supervised

name: lm_pretrain_tiny
trainer: {max_steps: 100, batch_size: 8, eval_every: 50}
optimizer: {lr: 1.0e-3}

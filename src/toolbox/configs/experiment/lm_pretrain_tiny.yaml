# @package _global_
# Minimal next-token pretraining on a tiny corpus, as a readable example.
# For large-scale pretraining see docs/guides/pretraining.md.
defaults:
  - override /model: tiny_gpt
  - override /data: tiny_corpus
  - override /objective: lm_ce
  - override /trainer: supervised

name: lm_pretrain_tiny
trainer: {max_steps: 100, batch_size: 8, eval_every: 50}
optimizer: {lr: 1.0e-3}

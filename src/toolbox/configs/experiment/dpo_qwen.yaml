# @package _global_
# DPO of Qwen2.5-0.5B-Instruct on JSONL preference pairs ({"prompt","chosen","rejected"}).
defaults:
  - override /tokenizer: qwen2_5
  - override /model: qwen2_5_0_5b
  - override /data: preference_arithmetic
  - override /objective: dpo
  - override /trainer: preference

name: dpo_qwen
data: {chat_template: true, max_length: 1024}
trainer: {max_steps: 1000, batch_size: 4, grad_accum_steps: 8, precision: bf16, save_every: 200}
optimizer: {lr: 5.0e-7, weight_decay: 0.0}
scheduler: {name: cosine, warmup_steps: 50}

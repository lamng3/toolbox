# @package _global_
# Student training for a Jev-style decision model: a Hugging Face LLM learns to give AnyJev's
# decision distribution in one forward pass. examples/jev/run.py sets the model and data path.
defaults:
  - override /objective: decision_distill   # KL to teacher distributions (no human labels needed)
  - override /trainer: supervised

name: jev_student
imports: [examples.jev.data]   # registers the anyjev_decisions dataset
tokenizer: {name: hf, name_or_path: Qwen/Qwen2.5-0.5B-Instruct}
model:
  name: hf_causal_lm
  model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
  dtype: float32
  lora: {r: 16, lora_alpha: 32, lora_dropout: 0.0, target_modules: all-linear, task_type: CAUSAL_LM}
data:
  name: anyjev_decisions
  path: ???                    # teacher-labelled JSONL written by run.py
  permute: true
  eval_fraction: 0.2           # must match run.py, which evaluates on the same held-out split
trainer: {max_steps: 100, batch_size: 8, eval_every: 50, log_every: 10}
optimizer: {name: adamw, lr: 2.0e-4, weight_decay: 0.0}
scheduler: {name: cosine, warmup_steps: 10}
